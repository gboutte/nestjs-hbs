name: Pr Checker

on:
  pull_request:
    types: [edited, synchronize, opened, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  # Formatting does not depend on the Node version, so it runs once and owns the
  # "please run npm run format" comment.
  format:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Code Format Nestjs
        id: codeFormatNest
        run: npm run format:check

      - name: Add Code Format Fail Comment Nest Only
        if: always() && steps.codeFormatNest.outcome == 'failure'
        uses: thollander/actions-comment-pull-request@v3
        with:
          message: |
            Thanks for your contribution ! But your PR does not seem to fit our code format standards. Please run the `npm run format` command and commit the changes.

  # Matches the `engines.node` range declared in package.json.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    name: test (node ${{ matrix.node }})
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install packages
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
