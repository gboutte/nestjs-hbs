name: Release package
on:
  workflow_dispatch:
    inputs:
      release-type:
        description: 'Release type (one of): patch, minor, major, prepatch, preminor, premajor, prerelease'
        required: true

permissions:
  id-token: write # mint the OIDC token npm trusted publishing needs
  contents: write # push the release commit, the tag and the GitHub release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # Releases are cut from the default branch only. workflow_dispatch would
      # otherwise happily publish from any branch and push the release commit there.
      - name: Check branch
        if: github.ref != 'refs/heads/master'
        run: |
          echo "Releases must be cut from master, got ${{ github.ref }}" >&2
          exit 1

      # Checkout project repository
      - name: Checkout
        uses: actions/checkout@v7

      # Setup Node.js environment
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci

      # Nothing gets published until the same gates the PRs go through are green.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Configure Git
      - name: Git configuration
        run: |
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global user.name "GitHub Actions"

      # Bump package version
      # Use tag latest
      - name: Bump release version
        if: startsWith(github.event.inputs.release-type, 'pre') != true
        run: |
          echo "NEW_VERSION=$(npm --no-git-tag-version version $RELEASE_TYPE)" >> $GITHUB_ENV
          echo "RELEASE_TAG=latest" >> $GITHUB_ENV
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release-type }}

      # Bump package pre-release version
      # Use tag beta for pre-release versions
      - name: Bump pre-release version
        if: startsWith(github.event.inputs.release-type, 'pre')
        run: |
          echo "NEW_VERSION=$(npm --no-git-tag-version --preid=beta version $RELEASE_TYPE)" >> $GITHUB_ENV
          echo "RELEASE_TAG=beta" >> $GITHUB_ENV
        env:
          RELEASE_TYPE: ${{ github.event.inputs.release-type }}

      - name: Build library
        run: npm run build

      # Last look at the tarball before it leaves the runner.
      - name: Inspect package contents
        run: npm pack --dry-run

      # Update changelog unreleased section with new version
      - name: Update changelog
        uses: superfaceai/release-changelog-action@v2
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: release

      # Commit changes
      - name: Commit CHANGELOG.md and package.json changes and create tag
        run: |
          git add "package.json"
          git add "CHANGELOG.md"
          git commit -m "chore: release ${{ env.NEW_VERSION }}"
          git tag ${{ env.NEW_VERSION }}

      # Publish version to public repository.
      # Authentication is OIDC only (trusted publishing). NODE_AUTH_TOKEN is
      # deliberately absent: `registry-url` above makes setup-node write
      # `_authToken=${NODE_AUTH_TOKEN}` into the runner .npmrc, and a value
      # there beats the token npm mints from OIDC.
      #
      # This step is deliberately identical to the one in gboutte/angular-
      # structured-data, which publishes over OIDC without trouble.
      - name: Publish
        run: npm publish --verbose --access public --provenance=false --tag ${{ env.RELEASE_TAG }}

      - name: Dump npm debug logs
        if: always()
        run: tail -n +1 "$HOME"/.npm/_logs/*.log

      # Push repository changes
      - name: Push changes to repository
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git push origin && git push --tags

      # Read version changelog
      - id: get-changelog
        name: Get version changelog
        uses: superfaceai/release-changelog-action@v2
        with:
          path-to-changelog: CHANGELOG.md
          version: ${{ env.NEW_VERSION }}
          operation: read

      # Update GitHub release with changelog
      - name: Update GitHub release documentation
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.NEW_VERSION }}
          body: ${{ steps.get-changelog.outputs.changelog }}
          prerelease: ${{ startsWith(github.event.inputs.release-type, 'pre') }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
